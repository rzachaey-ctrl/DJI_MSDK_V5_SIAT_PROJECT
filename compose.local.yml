services:
  mysql:
    image: mysql:8.0
    container_name: dji-cloud-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    env_file:
      - .env.local
    volumes:
      - dji-cloud-mysql-data:/var/lib/mysql
      - ./sql/cloud_sample.sql:/docker-entrypoint-initdb.d/001-cloud-sample.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  dji-cloud-mysql-data:
