apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def localConfiguration = new Properties()
def localConfigurationFile = rootProject.file("local.properties")
if (localConfigurationFile.exists()) {
    localConfigurationFile.withInputStream { localConfiguration.load(it) }
}
def aircraftApiKey = System.getenv("DJI_AIRCRAFT_API_KEY")
        ?: localConfiguration.getProperty("DJI_AIRCRAFT_API_KEY")
        ?: project.findProperty("AIRCRAFT_API_KEY")
        ?: ""
def signingStorePath = System.getenv("ANDROID_SIGNING_STORE_FILE")
        ?: localConfiguration.getProperty("ANDROID_SIGNING_STORE_FILE")
def signingStorePassword = System.getenv("ANDROID_SIGNING_STORE_PASSWORD")
        ?: localConfiguration.getProperty("ANDROID_SIGNING_STORE_PASSWORD")
def signingKeyAlias = System.getenv("ANDROID_SIGNING_KEY_ALIAS")
        ?: localConfiguration.getProperty("ANDROID_SIGNING_KEY_ALIAS")
def signingKeyPassword = System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
        ?: localConfiguration.getProperty("ANDROID_SIGNING_KEY_PASSWORD")
def releaseSigningConfigured = [
        signingStorePath,
        signingStorePassword,
        signingKeyAlias,
        signingKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace "dji.sampleV5.aircraft"
    compileSdkVersion Integer.parseInt(project.ANDROID_COMPILE_SDK_VERSION)

    defaultConfig {
        applicationId "com.dji.sampleV5.aircraft"
        minSdkVersion Integer.parseInt(project.ANDROID_MIN_SDK_VERSION)
        targetSdkVersion Integer.parseInt(project.ANDROID_TARGET_SDK_VERSION)
        versionCode 1
        versionName "1.0"
        manifestPlaceholders["API_KEY"] = aircraftApiKey
        manifestPlaceholders["GMAP_API_KEY"] = project.GMAP_API_KEY
        manifestPlaceholders["MAPLIBRE_TOKEN"] = project.MAPLIBRE_TOKEN
        def controlWsUrl = providers.environmentVariable("MSDK_CONTROL_WS_URL")
                .orElse(localConfiguration.getProperty("CONTROL_WS_URL"))
                .orElse(providers.gradleProperty("CONTROL_WS_URL"))
                .get()
        buildConfigField "String", "CONTROL_WS_URL", "\"${controlWsUrl}\""
        def controlDryRun = providers.environmentVariable("MSDK_CONTROL_DRY_RUN")
                .orElse(localConfiguration.getProperty("CONTROL_DRY_RUN"))
                .orElse(providers.gradleProperty("CONTROL_DRY_RUN"))
                .get()
        buildConfigField "boolean", "CONTROL_DRY_RUN", controlDryRun
        manifestPlaceholders["CONTROL_USES_CLEARTEXT"] =
                Boolean.parseBoolean(controlDryRun) ? "true" : "false"
        def controlAuthToken = providers.environmentVariable("MSDK_CONTROL_AUTH_TOKEN")
                .orElse(localConfiguration.getProperty("CONTROL_AUTH_TOKEN"))
                .orElse(providers.gradleProperty("CONTROL_AUTH_TOKEN"))
                .getOrElse("")
        buildConfigField "String", "CONTROL_AUTH_TOKEN", "\"${controlAuthToken}\""
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a'
        }
    }

    // Release signing is supplied only through the environment or ignored
    // local.properties. Debug builds use Android's per-developer debug key.
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile rootProject.file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        // 因为mrtc库内部使用了NDK的c++_shared的编译参数
        // 与其他库重复引用了，因此选其中一个即可
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    //关闭lint
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        doNotStrip "*/*/libconstants.so"
        doNotStrip "*/*/libdji_innertools.so"
        doNotStrip "*/*/libdjibase.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIFlySafeCore-CSDK.so"
        doNotStrip "*/*/libdjifs_jni-CSDK.so"
        doNotStrip "*/*/libDJIRegister.so"
        doNotStrip "*/*/libdjisdk_jni.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core-CSDK.so"
        doNotStrip "*/*/libdjiwpv2-CSDK.so"
        doNotStrip "*/*/libFlightRecordEngine.so"
        doNotStrip "*/*/libvideo-framing.so"
        doNotStrip "*/*/libwaes.so"
        doNotStrip "*/*/libagora-rtsa-sdk.so"
        doNotStrip "*/*/libc++.so"
        doNotStrip "*/*/libc++_shared.so"
        doNotStrip "*/*/libmrtc_28181.so"
        doNotStrip "*/*/libmrtc_agora.so"
        doNotStrip "*/*/libmrtc_core.so"
        doNotStrip "*/*/libmrtc_core_jni.so"
        doNotStrip "*/*/libmrtc_data.so"
        doNotStrip "*/*/libmrtc_log.so"
        doNotStrip "*/*/libmrtc_onvif.so"
        doNotStrip "*/*/libmrtc_rtmp.so"
        doNotStrip "*/*/libmrtc_rtsp.so"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseTaskRequested = taskGraph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains("release")
    }
    if (releaseTaskRequested && !releaseSigningConfigured) {
        throw new GradleException(
                "Release signing is not configured. Set ANDROID_SIGNING_STORE_FILE, " +
                        "ANDROID_SIGNING_STORE_PASSWORD, ANDROID_SIGNING_KEY_ALIAS, and " +
                        "ANDROID_SIGNING_KEY_PASSWORD in the environment or local.properties."
        )
    }
}

dependencies {
    /** <-----------------依赖MSDK--------------------> **/
    compileOnly deps.aircraftProvided
    implementation deps.aircraft

    /** <-----------------sample所需--------------------> **/
    implementation project(':uxsdk')
    implementation deps.appcompat
    implementation deps.constraintLayout
    implementation deps.aacCommon
    implementation deps.aacRuntime
    implementation deps.kotlinLib
    implementation deps.ktxCore
    implementation deps.ktxFrag
    implementation deps.ktxNavigation
    implementation deps.ktxNavigationUi
    implementation deps.recyclerview
    implementation deps.legacySupport
    implementation deps.lifecycleViewModel
    implementation deps.lifecycleLiveData
    implementation deps.leakcanary
    implementation deps.glide
    implementation deps.dynamicanimation
    implementation deps.expandedit
    implementation deps.rx3Kt
    implementation deps.dom
    kapt deps.glidecompiler
    implementation deps.lynx
    implementation deps.gson
    implementation deps.okhttp3
}
