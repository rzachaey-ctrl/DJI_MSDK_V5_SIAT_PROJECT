#gralde build config
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4608M

#use androidX
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

#去掉资源重复检查
android.disableResourceValidation=true

#build config
ANDROID_MIN_SDK_VERSION=24
ANDROID_TARGET_SDK_VERSION=35
ANDROID_COMPILE_SDK_VERSION=35
KOTLIN_VERSION = 2.1.0
NDK_VERSION = 21.4.7075529

#msdk api key
AIRCRAFT_API_KEY =

# Local Java backend WebSocket bridge. Keep dry-run enabled until field testing.
CONTROL_WS_URL = ws://172.30.86.19:6789/api/v1/msdk/control
CONTROL_DRY_RUN = true
CONTROL_AUTH_TOKEN =

#map key
GMAP_API_KEY =  ENTER YOUR Google Map API KEY
MAPLIBRE_TOKEN = ENTER YOUR  MapLibre TOKEN


# Release signing credentials belong in ignored local.properties or environment
# variables. Debug builds use Android's per-developer debug key.

#maven
KOTLIN_MAVEN = https://dl.bintray.com/kotlin/kotlin-eap
REPO_MAVEN2 = https://repo1.maven.org/maven2
JITPACK_MAVEN_URL = https://jitpack.io
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
